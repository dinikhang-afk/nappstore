name: Build Companion Tweak

on:
  push:
    branches: [main]
    paths: ['CompanionTweak/**']
  pull_request:
    branches: [main]
    paths: ['CompanionTweak/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install dpkg ldid
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -sL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C $THEOS/sdks/

      - name: Build deb
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd CompanionTweak
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IAPDumper
          path: CompanionTweak/packages/*.deb

name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)"

      - name: Build IPA
        run: |
          chmod +x build_ipa.sh
          bash build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NappStore
          path: output/NappStore.tipa
